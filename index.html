<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#FBF8F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15120F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="一場靠對話推進的曖昧。">
<title>曖昧</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===== 選角 ===== -->
<section id="view-select">
  <button id="gear" class="gear" aria-label="設定">⚙</button>

  <div class="hero">
    <h1>曖昧</h1>
    <div class="rule"></div>
    <p class="sub">
      你不會知道她是誰、經歷過什麼。<br>
      只能從一句一句的對話裡，慢慢認識。<br>
      <em>聊到她願意跟你出門，就算成功。</em>
    </p>
  </div>

  <span class="label">Choose someone</span>
  <div id="char-list" class="list"></div>
  <p class="tiphint">點頭像右下角的相機可以換成你自己的照片</p>
  <input id="photo-file" type="file" accept="image/*" hidden>

  <p class="foot">
    進度存在這台裝置的瀏覽器裡<br>
    清除瀏覽資料會一併消失，可在設定中匯出
  </p>
</section>

<!-- ===== 聊天室 ===== -->
<section id="view-chat" hidden>
  <header class="bar">
    <button id="back" class="back" aria-label="返回">‹</button>
    <div id="peer-av" class="av"></div>
    <div class="who">
      <b id="peer-name"></b>
      <span id="peer-state"></span>
    </div>
  </header>

  <div id="log" class="log"></div>

  <div class="composer">
    <textarea id="input" rows="1" placeholder="說點什麼…" enterkeyhint="send"
      autocapitalize="sentences" autocorrect="on"></textarea>
    <button id="send" class="send" aria-label="送出">↑</button>
  </div>
</section>

<!-- ===== 設定 ===== -->
<dialog id="dlg">
  <form>
    <div class="grab"></div>
    <h2>設定</h2>

    <label class="fld">
      <span>Anthropic API Key</span>
      <input id="dlg-key" type="password" placeholder="sk-ant-…" autocomplete="off"
        autocapitalize="off" autocorrect="off" spellcheck="false">
    </label>
    <p class="hint">金鑰只存在你自己的瀏覽器，不會傳給任何第三方 —— 這個網站沒有後端。</p>

    <label class="fld"><span>對話模型</span><input id="dlg-model" type="text" autocapitalize="off" spellcheck="false"></label>
    <label class="fld"><span>評分模型</span><input id="dlg-judge" type="text" autocapitalize="off" spellcheck="false"></label>

    <div class="chips">
      <button id="dlg-export" class="chip" type="button">匯出存檔</button>
      <label class="chip file">匯入存檔<input id="dlg-import" type="file" accept="application/json" hidden></label>
      <button id="dlg-reset" class="chip danger" type="button">清除進度</button>
    </div>

    <div class="acts">
      <button id="dlg-close" class="cancel" type="button">取消</button>
      <button id="dlg-save" class="ok" type="submit">儲存</button>
    </div>
  </form>
</dialog>

<script src="data/characters.js"></script>
<script src="js/personas.js"></script>
<script src="js/avatar.js"></script>
<script src="js/store.js"></script>
<script src="js/llm.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
